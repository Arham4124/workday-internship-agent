# ---- Pay, GPA, communications ----
- question: Desired salary / compensation expectations
  answer: "Match the posted pay range; if none is posted, use compensation.default_hourly_usd from the profile."
- question: GPA (the number itself)
  answer: "Leave blank. If a form requires the GPA number, stop and ask the user."
- question: Is your GPA at or above a cutoff (e.g. 2.5, 2.8, 3.0, 3.2, 3.5)?
  answer: ""   # e.g. "Yes for any cutoff of 3.5 or lower. For a higher cutoff, stop and ask the user."
- question: Do you consent to receive text messages / communications about your application?
  answer: "Yes to email; No to marketing texts when optional."

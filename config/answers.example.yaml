# Answer bank: your standard answers to questions Workday forms ask. Copy to answers.yaml (`./agent.sh init`).
# Fill in every "" below (see QUESTIONNAIRE.md). A blank answer means "stop and ask me": the application is
# paused and the question shows up in `./agent.sh answer`, which saves your reply here for every future form.
# The first three entries are behaviour rules for the agent — keep them unless you want different behaviour.

- question: How did you hear about this position?
  answer: "The company's own careers website (that is where the agent finds postings). Choose the company website / careers site option, which may sit inside a category such as '<Company> Source' or 'Website'. Never choose LinkedIn, Indeed, a referral, a career fair, or social media. If no such option exists, choose 'Other' / 'Online job search'."
- question: Do you meet the basic / required / preferred qualifications listed in the job description?
  answer: "Compare the posting's list with the profile, item by item. If every item is met: Yes. If some are met and a partial option exists (e.g. 'Yes, some'): choose it. If only Yes/No is offered for PREFERRED qualifications and not all are met: No."
- question: Which locations are you open to / location preferences?
  answer: ""   # e.g. "Open to every U.S. location offered (select all when allowed). If asked to rank, put the posting's own location first."

